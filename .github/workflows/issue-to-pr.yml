name: Issue to PR

# Part of the "sisyphus is the source of truth" workflow (see CONTRIBUTING.md#GitHub issues).
# Turns a newly filed GitHub issue into a PR that adds the matching sisyphus issue, pinned to it.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-issue-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install sisyphus
        run: go install github.com/runewake2/sisyphus/cmd/sisyphus@latest

      - name: Build the sisyphus issue
        id: build
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          name="$(sisyphus slug "$ISSUE_TITLE")"
          sisyphus new "$name" --title "$ISSUE_TITLE" --remote "$ISSUE_URL" --context "$ISSUE_BODY"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NAME: ${{ steps.build.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sisyphus/issue-$ISSUE_NUMBER"
          git checkout -b "$branch"
          git add "issues/open/$NAME.md"
          git commit -m "Add issue $NAME from GitHub issue #$ISSUE_NUMBER"
          git push origin "$branch"
          pr_url="$(gh pr create --title "Add issue: $NAME" --body "Opened from #$ISSUE_NUMBER. Review the generated issue, then merge to track the work in \`issues/\`." --head "$branch")"
          gh issue comment "$ISSUE_NUMBER" --body "Picked up as a sisyphus issue: $pr_url"
